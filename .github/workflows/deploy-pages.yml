name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Pages Functions worker
        run: |
          npx wrangler pages functions build functions \
            --project-directory . \
            --outfile out/_worker.js \
            --output-routes-path out/_routes.json \
            --build-output-directory out

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4c2341810414766ae8cbf672785e82c5 # pragma: allowlist secret
          command: pages deploy ./out --project-name welcome-to-willville --branch main
