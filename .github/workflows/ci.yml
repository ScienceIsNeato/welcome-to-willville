name: CI

on:
  pull_request:

permissions:
  contents: read

# Cancel a superseded run when a newer commit lands on the same ref, so rapid
# pushes don't stack up redundant runs (the main Actions-budget drain).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The project's own deps go in .venv. The slop-mop gates detect this venv
      # and analyze against it — so dependency-risk audits the project's real
      # dependencies (not the action's tool env) and type-aware gates resolve the
      # project's imports. The action installs slop-mop + its gate tools
      # separately (pipx), so slop-mop's transitive deps stay out of this audit.
      - name: Set up Python venv with project deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # actionlint is a system tool the dependency manifest can't install (Go
      # binary); github-actions-hygiene is applicable here (we have workflows).
      - name: Install actionlint (for the github-actions-hygiene gate)
        run: |
          ver=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          echo "${sha256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          rm -f actionlint.tar.gz

      # Quality gates via the official Action: installs slop-mop core, verifies
      # the committed manifest, installs exactly its pinned tools (incl. the
      # find-duplicate-strings npm scanner), then scours. Replaces the former
      # hand-spun `pip install slopmop[all]==1.5.0` + `sm scour`.
      - name: Quality gates
        uses: ScienceIsNeato/slop-mop-action@v2
        with:
          command: scour
          upload-sarif: "false"

      - name: Build
        run: npm run build
