name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install slop-mop
        run: |
          pip install slopmop==1.2.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Quality gates
        run: sm scour

      - name: Build
        run: npm run build
