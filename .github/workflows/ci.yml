name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install slop-mop
        run: |
          .venv/bin/pip install 'slopmop[all]==1.5.0'
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install slop-mop JS gate tools
        run: npm install -g find-duplicate-strings@3.1.1

      - name: Quality gates
        run: sm scour || (echo "=== Gate logs ===" && cat .slopmop/logs/*.log && exit 1)

      - name: Build
        run: npm run build
